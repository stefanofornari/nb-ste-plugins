name: Deploy NetBeans update site to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build
        run: mvn -B -Dmaven.test.skip=true package

      - name: Prepare site
        run: |
          echo "Listing target before publish"
          ls -la target || true
          if [ -d nb-ste-plugins-portal/target/netbeans_site ]; then
            ls -la nb-ste-plugins-portal/target/netbeans_site
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: nb-ste-plugins-portal/target/netbeans_site
          publish_branch: main
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
